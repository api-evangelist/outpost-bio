aid: outpost-bio
name: Outpost Bio
description: >-
  Outpost Bio builds frontier AI foundation models for the human microbiome. Its
  "lab-in-the-loop" platform pairs high-throughput wet-lab experiments with machine
  learning in a continuous cycle to predict how drugs and ingredients interact with
  microbial ecosystems, helping de-risk drug and ingredient R&D decisions around
  metabolism, toxicity, and efficacy. The company's public developer surface is the
  open-source Waypoint Python library and CLI (published to PyPI as waypoint-bio) plus
  gated Waypoint model checkpoints, the Atlas pretraining dataset, and the Compass
  benchmark suite on the Hugging Face Hub. Outpost Bio is a Seedcamp portfolio company
  and does not currently publish a hosted web API.
